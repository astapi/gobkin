appId: com.astapi.gobkin
name: 日次上限到達後の停止中表示から自動再開を停止できる
---
- launchApp:
    clearState: false
- tapOn:
    text: "許可しない"
    optional: true
- tapOn:
    text: "キャンセル"
    optional: true
- tapOn: "ゲームをはじめる"
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: "93%,94%"
- openLink: "gobkin://formation"
- tapOn:
    text: "開く"
    optional: true
- tapOn:
    text: "開く"
    optional: true
- assertVisible:
    id: "auto-expedition-waiting-1"
- assertVisible: "自動周回 停止中、翌日 0:00再開"
- tapOn:
    id: "party-card-1"
- scrollUntilVisible:
    element:
      text: "本日の上限に到達しました。"
    direction: DOWN
- assertVisible: "本日の上限に到達しました。"
- assertVisible: "翌日 0:00に再開します。"
- tapOn: "← 戻る"
- tapOn:
    id: "auto-expedition-waiting-1"
- assertVisible: "翌日の自動再開を停止します。"
- tapOn: "停止する"
- assertVisible:
    id: "auto-expedition-summary-1"
